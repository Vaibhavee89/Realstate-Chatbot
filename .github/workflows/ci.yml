name: CI

# Every push and pull request: run the tests, gate retrieval quality, then build the Docker image and smoke-test it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests and retrieval gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q app scraper tests eval scripts

      # These start the app against a fake OpenRouter: no API key, no network, no quota used.
      - name: Data-freshness validation tests
        run: python tests/test_build_meta.py
      - name: Resilience tests (fallback chain, retry, quota message)
        run: python tests/test_resilience.py
      - name: Lead capture, logging and admin tests
        run: python tests/test_leads_logging.py

      # Builds the embedding index (downloads the small model once), then fails if retrieval quality regresses or a
      # guardrail pattern starts firing on factual questions. Needs no model API: it only checks what is retrieved.
      - name: Retrieval-quality gate
        run: |
          python -m app.build_index
          python eval/run_eval.py --retrieval-only --min-retrieval 0.9

  docker:
    name: Build and smoke-test the Docker image
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image (same Dockerfile Render uses)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: realestate-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: scripts/smoke_container.sh realestate-bot:ci 8000
