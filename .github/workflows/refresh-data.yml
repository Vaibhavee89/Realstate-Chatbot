name: Refresh data

# Weekly: re-crawl DarGlobal, rebuild the Wasalt sitemap catalog, validate, and commit if anything changed.
# Pushing to main redeploys the app on Render, whose Docker build re-embeds the data. The UI shows the date from
# data/meta.json ("Data last updated ...").
on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:        # run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scraper.txt

      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4 lxml

      - name: Run the data tests
        run: python tests/test_build_meta.py

      - name: Re-crawl DarGlobal
        run: python scraper/scrape.py --site dar

      # wasalt.sa is behind Cloudflare; its sitemaps (cdn.wasalt.sa) have been reachable, but a runner IP may be
      # challenged. If so the previous catalog is kept and the validation below still passes on the old numbers.
      - name: Rebuild the Wasalt catalog from its public sitemaps
        run: python scraper/wasalt_sitemap.py
        continue-on-error: true

      # Refuses (exit 1, nothing committed) if a source shrank below 80% of the last run or came back empty.
      - name: Validate and write data/meta.json
        run: python scraper/build_meta.py --min-ratio 0.8

      - name: Commit and push if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pages.jsonl data/wasalt_catalog.jsonl data/meta.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(data): weekly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
